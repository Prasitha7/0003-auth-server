spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

app:
  auth:
    issuer: http://localhost:9000
  security:
    cors:
      allowed-origins: http://localhost:3000
